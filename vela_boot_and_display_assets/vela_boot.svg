<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<title>vela — microkernel boot splash</title>
<desc>Dark boot image for ESP32-P4 / M5Stack Tab5; original orbital mark, wordmark and pixel crab.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#07131F"/>
  <stop offset="1" stop-color="#0C1E30"/>
 </linearGradient>
 <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#66DFFF"/>
  <stop offset="1" stop-color="#85BFFF"/>
 </linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<!-- faint framing; part of the boot style, not LCD test marks -->
<path d="M60 115V58H117 M1163 58H1220V115 M60 605V662H117 M1163 662H1220V605" fill="none" stroke="#2D536D" stroke-width="2"/>
<text x="76" y="90" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" letter-spacing="3" fill="#709EB9">VELA / EMBEDDED SYSTEMS</text>
<text x="1197" y="90" text-anchor="end" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16" letter-spacing="2" fill="#709EB9">ESP32-P4</text>
<!-- Original orbit symbol, visually unmodified except weight/scale -->
<g transform="translate(161 199) scale(13.1)">
<g fill="none" stroke="url(#orbit)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3" />
  <circle cx="19" cy="5" r="2" />
  <circle cx="5" cy="19" r="2" />
  <path d="M10.4 21.9a10 10 0 0 0 9.941-15.416"/>
  <path d="M13.5 2.1a10 10 0 0 0-9.841 15.416"/>
</g></g>
<!-- Text lockup -->
<text x="542" y="366" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="166" font-weight="650" letter-spacing="-9" fill="#E9F7FF">vela</text>
<rect x="551" y="393" width="414" height="3" rx="1.5" fill="#4EBADC"/>
<rect x="971" y="393" width="17" height="3" fill="#F47A52"/>
<text x="546" y="459" font-family="Inter Display, Inter, DejaVu Sans, sans-serif" font-size="44" font-weight="500" letter-spacing="0" fill="#85BFFF">microkernel</text>
<text x="549" y="504" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="20" letter-spacing="1.2" fill="#86A9BF">RUST  /  NO_STD  /  BARE METAL</text>
<!-- A little pixel-art crab perched above the title, rust-colored hardware wink -->
<g transform="translate(946 222)" shape-rendering="crispEdges">
<rect x="5" y="5" width="15" height="5" fill="#F47A52"/>
<rect x="115" y="5" width="15" height="5" fill="#F47A52"/>
