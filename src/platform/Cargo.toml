[package]
name = "vela-boot-esp32p4"
version = "0.3.0"
edition = "2024"
build = "build.rs"

[dependencies]
vela-abi = { path = "../abi" }
vela-kernel = { path = "../kernel" }
vela-lp = { path = "../lp" }
critical-section = "1.2"
esp-synopsys-usb-otg = { version = "0.4.2", features = ["fs", "esp32sx"] }
usb-device = "0.3.2"

[[bin]]
name = "vela-boot-esp32p4"
path = "src/main.rs"
test = false
bench = false
